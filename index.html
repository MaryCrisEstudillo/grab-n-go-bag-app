<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e12b2b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="GrabnGo bag — track emergency-kit items and their expiry dates."
    />
    <title>GrabnGo bag</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('grabngo-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved !== 'light' && dark))
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
